name: Build postmarketOS for Redmi Pad (yunluo)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WORK: /home/runner/pmbootstrap-work
  PMAPORTS: /home/runner/pmaports
  PMB: python3 /home/runner/pmbootstrap/pmbootstrap.py

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git python3 wget openssl bison flex bc libssl-dev

    - name: Install pmbootstrap
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /home/runner/pmbootstrap
        python3 /home/runner/pmbootstrap/pmbootstrap.py --version

    - name: Clone pmaports and copy device packages
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git $PMAPORTS
        mkdir -p $PMAPORTS/device/testing/device-xiaomi-yunluo
        mkdir -p $PMAPORTS/device/linux/linux-xiaomi-yunluo
        cp -r device-xiaomi-yunluo/. $PMAPORTS/device/testing/device-xiaomi-yunluo/
        cp -r linux-xiaomi-yunluo/. $PMAPORTS/device/linux/linux-xiaomi-yunluo/

    - name: Generate sha512sums
      run: |
        cd linux-xiaomi-yunluo
        wget -q -O kernel-yunluo.tar.gz https://github.com/MiCode/Xiaomi_Kernel_OpenSource/archive/refs/heads/yunluo-s-oss.tar.gz
        KERNEL_SHA=$(sha512sum kernel-yunluo.tar.gz | cut -d' ' -f1)
        CONFIG_SHA=$(sha512sum config-xiaomi-yunluo.aarch64 | cut -d' ' -f1)
        sed -i "s|SKIP  kernel-yunluo.tar.gz|$KERNEL_SHA  kernel-yunluo.tar.gz|" APKBUILD
        sed -i "s|SKIP  config-xiaomi-yunluo.aarch64|$CONFIG_SHA  config-xiaomi-yunluo.aarch64|" APKBUILD
        cp APKBUILD $PMAPORTS/device/linux/linux-xiaomi-yunluo/APKBUILD
        cp kernel-yunluo.tar.gz $PMAPORTS/device/linux/linux-xiaomi-yunluo/
        cd ../device-xiaomi-yunluo
        DEVINFO_SHA=$(sha512sum deviceinfo | cut -d' ' -f1)
        MODULES_SHA=$(sha512sum modules-initfs | cut -d' ' -f1)
        sed -i "s|SKIP  deviceinfo|$DEVINFO_SHA  deviceinfo|" APKBUILD
        sed -i "s|SKIP  modules-initfs|$MODULES_SHA  modules-initfs|" APKBUILD
        cp APKBUILD $PMAPORTS/device/testing/device-xiaomi-yunluo/APKBUILD

    - name: Setup pmbootstrap work dir and config
      run: |
        mkdir -p $WORK/cache_git
        ln -s $PMAPORTS $WORK/cache_git/pmaports
        mkdir -p $HOME/.config
        printf '[pmbootstrap]\nwork = /home/runner/pmbootstrap-work\naports = /home/runner/pmaports\ndevice = xiaomi-yunluo\nui = console\nuser = user\nhostname = redmipad\nextra_packages = none\n' > $HOME/.config/pmbootstrap_v3.cfg
        echo "8" > $WORK/version
        $PMB build_init

    - name: Build device package (no kernel)
      run: $PMB build device-xiaomi-yunluo

    - name: Create rootfs
      run: |
        $PMB chroot -r -- apk update
        $PMB chroot -r -- apk add postmarketos-base device-xiaomi-yunluo postmarketos-ui-console openssh
        $PMB chroot -r -- sh -c 'adduser -D -s /bin/sh user; echo "user:1234" | chpasswd'

    - name: Collect and upload images
      run: |
        mkdir -p output
        ROOTFS=$WORK/chroot_rootfs_xiaomi-yunluo
        # Создаём ext4 образ для fastboot flash userdata
        SIZE_MB=3000
        dd if=/dev/zero of=output/pmos-yunluo.img bs=1M count=$SIZE_MB
        mkfs.ext4 -L pmOS_root output/pmos-yunluo.img
        mkdir -p /tmp/mnt
        sudo mount -o loop output/pmos-yunluo.img /tmp/mnt
        echo "=== ROOTFS contents ==="
        ls -la $ROOTFS/
        echo "=== Size ==="
        du -sh $ROOTFS/ 2>/dev/null || true
        sudo rsync -a           --exclude=/proc           --exclude=/sys           --exclude=/dev           --exclude=/var/cache           --exclude=/mnt           --exclude=/usr/bin/qemu-aarch64-static           $ROOTFS/ /tmp/mnt/
        sudo umount /tmp/mnt
        ls -lh output/

    - name: Convert to sparse and compress
      run: |
        sudo apt-get install -y android-tools-fsutils 2>/dev/null ||         sudo apt-get install -y simg2img 2>/dev/null || true
        cd output
        # Конвертируем в sparse format для fastboot
        img2simg pmos-yunluo.img pmos-yunluo-sparse.img 2>/dev/null ||         /usr/bin/img2simg pmos-yunluo.img pmos-yunluo-sparse.img 2>/dev/null || true
        ls -lh
        # Сжимаем sparse образ
        gzip -1 pmos-yunluo-sparse.img 2>/dev/null || gzip -1 pmos-yunluo.img
        ls -lh

    - uses: actions/upload-artifact@v4
      with:
        name: pmos-yunluo-${{ github.run_number }}
        path: output/pmos-yunluo-sparse.img.gz
        retention-days: 14
