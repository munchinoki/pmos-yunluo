name: Build postmarketOS for Redmi Pad (yunluo)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WORK: /home/runner/pmbootstrap-work
  PMAPORTS: /home/runner/pmaports
  DEVICE_CODENAME: yunluo
  DEVICE_VENDOR: xiaomi

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git python3 wget openssl bison flex bc libssl-dev

    - name: Install pmbootstrap
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
        python3 ~/pmbootstrap/pmbootstrap.py --version

    - name: Clone pmaports
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git $PMAPORTS

    - name: Show yunluo packages in pmaports
      run: |
        echo "=== device ==="
        ls $PMAPORTS/device/testing/ | grep yunluo || echo "not found"
        echo "=== linux ==="
        ls $PMAPORTS/device/linux/ | grep yunluo || echo "not found"

    - name: Init pmbootstrap
      run: |
        printf "$WORK\\n$PMAPORTS\\nedge\\n$DEVICE_VENDOR\\n$DEVICE_CODENAME\\nuser\\npipewire\\niwd\\ndeveloper\\nconsole\\nnever\\nn\\nnone\\nn\\nen_US\\nredmipad\\ny\\nn\\n" | python3 ~/pmbootstrap/pmbootstrap.py init

    - name: Build kernel
      run: |
        python3 ~/pmbootstrap/pmbootstrap.py build linux-xiaomi-yunluo 2>&1 || true

    - name: Show pmbootstrap log
      run: |
        cat $WORK/log.txt 2>/dev/null | tail -100 || echo "log not found"

    - name: Build device package
      run: |
        python3 ~/pmbootstrap/pmbootstrap.py build device-xiaomi-yunluo

    - name: Create rootfs
      run: |
        python3 ~/pmbootstrap/pmbootstrap.py install --password 1234

    - name: Collect images
      run: |
        mkdir -p output
        find $WORK -name "*.img" -exec cp {} output/ \; 2>/dev/null || true
        ls -lh output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pmos-yunluo-${{ github.run_number }}
        path: output/
        retention-days: 14
